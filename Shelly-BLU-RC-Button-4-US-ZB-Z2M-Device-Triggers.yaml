blueprint:
  name: Shelly BLU RC Button 4 US ZB Z2M (Device Triggers)
  description: 
    Home Assistant Blueprint for automating the Shelly BLU RC Button 4 ZB (SBBT-104CUS)
    using Zigbee2MQTT device triggers directly. Avoids relying on event helper entities.
  domain: automation
  input:
    remote_device:
      name: Shelly BLU RC Button 4 Remote
      description: Select the Zigbee2MQTT device.
      selector:
        device:
          filter:
            integration: mqtt
            manufacturer: Shelly
            model: BLU RC Button 4 ZB
    
    # --- BUTTON 1 ACTIONS ---
    b1_single:
      name: Button 1 - Single
      default: []
      selector:
        action: {}
    b1_double:
      name: Button 1 - Double
      default: []
      selector:
        action: {}
    b1_triple:
      name: Button 1 - Triple
      default: []
      selector:
        action: {}
    b1_single_long:
      name: Button 1 - Single Long
      default: []
      selector:
        action: {}
    b1_double_long:
      name: Button 1 - Double Long
      default: []
      selector:
        action: {}
    b1_triple_long:
      name: Button 1 - Triple Long
      default: []
      selector:
        action: {}
    b1_hold:
      name: Button 1 - Hold
      default: []
      selector:
        action: {}

    # --- BUTTON 2 ACTIONS ---
    b2_single:
      name: Button 2 - Single
      default: []
      selector:
        action: {}
    b2_double:
      name: Button 2 - Double
      default: []
      selector:
        action: {}
    b2_triple:
      name: Button 2 - Triple
      default: []
      selector:
        action: {}
    b2_single_long:
      name: Button 2 - Single Long
      default: []
      selector:
        action: {}
    b2_double_long:
      name: Button 2 - Double Long
      default: []
      selector:
        action: {}
    b2_triple_long:
      name: Button 2 - Triple Long
      default: []
      selector:
        action: {}
    b2_hold:
      name: Button 2 - Hold
      default: []
      selector:
        action: {}

    # --- BUTTON 3 ACTIONS ---
    b3_single:
      name: Button 3 - Single
      default: []
      selector:
        action: {}
    b3_double:
      name: Button 3 - Double
      default: []
      selector:
        action: {}
    b3_triple:
      name: Button 3 - Triple
      default: []
      selector:
        action: {}
    b3_single_long:
      name: Button 3 - Single Long
      default: []
      selector:
        action: {}
    b3_double_long:
      name: Button 3 - Double Long
      default: []
      selector:
        action: {}
    b3_triple_long:
      name: Button 3 - Triple Long
      default: []
      selector:
        action: {}
    b3_hold:
      name: Button 3 - Hold
      default: []
      selector:
        action: {}

    # --- BUTTON 4 ACTIONS ---
    b4_single:
      name: Button 4 - Single
      default: []
      selector:
        action: {}
    b4_double:
      name: Button 4 - Double
      default: []
      selector:
        action: {}
    b4_triple:
      name: Button 4 - Triple
      default: []
      selector:
        action: {}
    b4_single_long:
      name: Button 4 - Single Long
      default: []
      selector:
        action: {}
    b4_double_long:
      name: Button 4 - Double Long
      default: []
      selector:
        action: {}
    b4_triple_long:
      name: Button 4 - Triple Long
      default: []
      selector:
        action: {}
    b4_hold:
      name: Button 4 - Hold
      default: []
      selector:
        action: {}

mode: restart
max_exceeded: silent

trigger:
  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: "1_single"
    id: b1_single
  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: "1_double"
    id: b1_double
  - platform: device
    domain: mqtt
    device_id: !input remote_device
    type: action
    subtype: "1_triple"
    id: b1_triple
  - platform: device
